[service]
# Gunicorn is managed locally; install/uninstall manage only the nginx route.
bind = 127.0.0.1:9001
# Relative to this checkout; leave empty to detect .venv or venv.
venv =
url_prefix = /poe2-guild
nginx_file = /etc/nginx/sites-enabled/services
# Leave empty only when the file contains exactly one server block.
nginx_server =
