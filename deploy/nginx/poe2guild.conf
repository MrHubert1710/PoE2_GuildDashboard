# Include inside the existing server block for dyyyl.ovh.
# ./poe2guild install installs the equivalent route from service.ini.
location /poe2guild/ {
    proxy_pass http://127.0.0.1:9002/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location = /poe2guild {
    return 301 /poe2guild/;
}
